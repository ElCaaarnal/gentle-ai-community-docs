schema: spec-driven

context: |
  Project: Gentle AI Community Documentation.
  Stack: Astro 7.2.4 static site, TypeScript 5.9 strict configuration, vanilla JavaScript, and CSS.
  Architecture: bilingual static routes `/` and `/es/`, shared Astro components, client behavior in `src/scripts/site.js`.
  Deployment: Netlify static hosting with `npm run build` and `dist/`.
  Conventions: npm scripts, GitHub Flow feature branches and pull requests, English SDD artifacts.
  Repository baseline: `feat/mcp-documentation` was clean with exact HEAD equal to `origin/main`; initialization changes only this config file; issue #34 is approved and open.
  Persistence: hybrid OpenSpec + Engram; preserve existing specs and archived changes.
  Testing: Playwright E2E via `npx playwright test`, Astro type checking via `npm run check`, and production validation via `npm run build`.

strict_tdd: true

testing:
  detected: 2026-08-29
  strict_tdd: true
  workspace_test_command: npx playwright test
  projects:
    - path: "."
      stack: Astro 7.2.4 static site, TypeScript 5.9, vanilla JavaScript, and CSS
      test_command: npx playwright test
      framework: Playwright 1.61.0
      verification_commands:
        - npm run check
        - npm run build
      prerequisites:
        - npx playwright install --with-deps chromium
  test_runner:
    available: true
    command: npx playwright test
    framework: Playwright 1.61.0
  layers:
    unit:
      available: false
      tool: null
    integration:
      available: false
      tool: null
    e2e:
      available: true
      tool: Playwright 1.61.0
  coverage:
    available: false
    command: null
  quality_tools:
    linter:
      available: false
      command: null
    type_checker:
      available: true
      command: npm run check
    formatter:
      available: false
      command: null

rules:
  proposal:
    - Keep the existing implementation untouched until a change is approved; describe rollback for any risky change.
  specs:
    - Use Given/When/Then scenarios and RFC 2119 keywords.
  design:
    - Document architecture decisions and their rationale; include diagrams for complex flows.
  tasks:
    - Group tasks by phase with hierarchical numbering; keep tasks completable in one session.
  apply:
    guidelines:
      - Follow existing Astro, TypeScript, CSS, and vanilla JavaScript conventions after approval.
    tdd: true
    test_command: npx playwright test
  verify:
    test_command: npx playwright test
    build_command: npm run build
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas.
