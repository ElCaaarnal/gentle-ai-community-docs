name: Docs browser

on:
  pull_request:
    paths:
      - '**.astro'
      - '**.css'
      - '**.js'
      - '**.ts'
      - 'assets/**'
      - 'public/**'
      - 'package*.json'
      - '.github/workflows/docs-browser.yml'
  push:
    branches:
      - main

jobs:
  chromium:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: npm run build
      - run: npx playwright test
