name: Docs browser

on:
  pull_request:
    paths:
      - '**.astro'
      - '**.css'
      - '**.js'
      - '**.ts'
      - 'assets/**'
      - 'public/**'
      - 'package*.json'
      - '.github/workflows/docs-browser.yml'
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: 'Regenerate Linux visual baselines and upload them as an artifact'
        type: boolean
        default: false

jobs:
  chromium:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: npm run build
      - run: npx playwright test ${{ inputs.update_snapshots && '--update-snapshots' || '' }}
      - if: inputs.update_snapshots
        uses: actions/upload-artifact@v4
        with:
          name: linux-snapshots
          path: tests/docs.spec.ts-snapshots/*-linux.png
          if-no-files-found: error
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
