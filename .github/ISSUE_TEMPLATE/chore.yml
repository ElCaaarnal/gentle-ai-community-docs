name: Chore or maintenance
description: Tooling, CI, build, dependency, or repository housekeeping.
labels: ["type:chore"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What needs maintaining, and what goes wrong if it is left alone.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Commands, logs, timings, or configuration showing the current state.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: How to tell the chore is complete.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Not in scope
    validations:
      required: false
