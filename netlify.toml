# Mirrors the build settings held in the Netlify UI. Once this file exists it
# takes precedence over them, so `command` and `publish` must stay in sync with
# the values documented in README.md.
[build]
  command = "npm run build"
  publish = "dist"

  # Cancel the build when the push changed nothing that ships. `git diff
  # --quiet` exits 0 when there are no differences outside the excluded paths,
  # and Netlify cancels a build whose ignore command exits 0 — before installing
  # dependencies. When $CACHED_COMMIT_REF is unavailable (first build, cleared
  # cache) the diff fails and the build proceeds, which is the safe direction.
  #
  # The exclusion list is a denylist rather than an allowlist on purpose: a path
  # nobody thought to list still triggers a build, so a genuinely shipping
  # addition can never be silently skipped. `openspec/` holds the SDD record and
  # `docs/` the operator runbooks; Astro builds from `src/pages`, so neither one
  # reaches `dist/` and neither should spend a metered production deploy.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- ':!tests/**' ':!.github/**' ':!openspec/**' ':!docs/**' ':!README.md' ':!CONTRIBUTING.md' ':!SECURITY.md' ':!CODE_OF_CONDUCT.md' ':!LICENSE' ':!.nvmrc'"
